# Simple Python setup for Railway
[providers]
python = "3.11"

[phases.setup]
nixPkgs = ["python311Full"]

[phases.install]
cmds = [
  "python3 -m ensurepip || echo 'ensurepip failed, trying alternative...'",
  "python3 -m pip install --upgrade pip setuptools wheel || pip3 install --upgrade pip setuptools wheel",
  "python3 -m pip install -r requirements.txt || pip3 install -r requirements.txt"
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
